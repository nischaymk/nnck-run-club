services:
  - type: web
    name: nnck-run-club
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn nnck_club.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: RENDER
        value: "true"
